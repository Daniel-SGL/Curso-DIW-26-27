<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Trastienda - Mi cesta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <h1>Mi cesta · 2 artículos</h1>
    </header>

    <main>
        <section aria-label="Productos en la cesta">
            <ul>
                <li>
                    <article>
                        <img src="img/la-paciente-silenciosa.jpg" alt="Portada de La paciente silenciosa" width="80"
                            height="120">
                        <h2><a href="detalle.html">La paciente silenciosa</a></h2>
                        <p>Alex Michaelides · Tapa dura</p>
                        <div>
                            <button type="button" aria-label="Reducir cantidad">−</button>
                            <span>1</span>
                            <button type="button" aria-label="Aumentar cantidad">+</button>
                        </div>
                        <p>19,90 €</p>
                    </article>
                </li>
                <li>
                    <article>
                        <img src="img/el-silencio-de-la-ciudad-blanca.jpg"
                            alt="Portada de El silencio de la ciudad blanca" width="80" height="120">
                        <h2><a href="detalle.html">El silencio de la ciudad blanca</a></h2>
                        <p>Eva García Sáenz de Urturi · Ebook</p>
                        <div>
                            <button type="button" aria-label="Reducir cantidad">−</button>
                            <span>1</span>
                            <button type="button" aria-label="Aumentar cantidad">+</button>
                        </div>
                        <p>9,99 €</p>
                    </article>
                </li>
            </ul>
        </section>

        <section aria-label="Resumen del pedido">
            <h2>Resumen</h2>
            <dl>
                <div>
                    <dt>Subtotal</dt>
                    <dd>29,89 €</dd>
                </div>
                <div>
                    <dt>Envío</dt>
                    <dd>Gratis</dd>
                </div>
                <div>
                    <dt>Total</dt>
                    <dd>29,89 €</dd>
                </div>
            </dl>
            <button type="button">Tramitar pedido</button>
        </section>
    </main>

    <nav aria-label="Secciones de la app">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="explorar.html">Explorar</a></li>
            <li><a href="carrito.html" aria-current="page">Cesta</a></li>
            <li><a href="perfil.html">Perfil</a></li>
        </ul>
    </nav>
</body>

</html>
